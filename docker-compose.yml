services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: professor_connect
      POSTGRES_USER: professor_connect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    ports:
      - '5432:5432'
    volumes:
      - professor-connect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U professor_connect -d professor_connect']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql://professor_connect:${POSTGRES_PASSWORD:-development-only}@postgres:5432/professor_connect
      HOST: 0.0.0.0
      NODE_ENV: development
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - professor-connect-node-modules:/app/node_modules

volumes:
  professor-connect-node-modules:
  professor-connect-postgres:
