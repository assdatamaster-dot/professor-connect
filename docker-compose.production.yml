name: professor-connect

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-professor_connect}
      POSTGRES_USER: ${POSTGRES_USER:-professor_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - professor-connect-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-professor_connect} -d ${POSTGRES_DB:-professor_connect}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${PROFESSOR_CONNECT_IMAGE:-professor-connect-backend:0.1.0}
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-professor_connect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-professor_connect}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-60000}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-90000}
      RECONNECT_WINDOW_MS: ${RECONNECT_WINDOW_MS:-90000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-professor-connect}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-professor-connect-clients}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health').then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      # `backend:prepare` regenera o Prisma Client antes do start, mesmo com o rootfs read-only.
      - /app/node_modules/.prisma:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  professor-connect-postgres:
